<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Veille Sécu — Alertes de sécurité</title>
  <meta name="description" content="Tableau de veille en temps réel des alertes de sécurité (CERT-FR, IT-Connect) à partir des flux RSS.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
      </div>
      <div>
        <h1>Veille Sécu</h1>
        <p class="subtitle"><span class="pulse" id="liveDot"></span><span id="lastUpdate">Chargement…</span></p>
      </div>
    </div>

    <div class="search">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Rechercher un produit, une CVE, un éditeur…  ( / )" autocomplete="off">
    </div>

    <div class="actions">
      <button class="icon-btn" id="refreshBtn" title="Actualiser maintenant (R)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
      </button>
      <button class="icon-btn" id="notifBtn" title="Notifications du navigateur">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      </button>
      <button class="icon-btn" id="themeBtn" title="Changer de thème">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main class="container">
    <section class="stats" id="stats" aria-label="Statistiques par catégorie"></section>

    <nav class="tabs" id="tabs" role="tablist" aria-label="Catégories"></nav>

    <section class="toolbar">
      <div class="chips" id="periodChips">
        <button class="chip" data-period="1">24 h</button>
        <button class="chip" data-period="7">7 jours</button>
        <button class="chip" data-period="30">30 jours</button>
        <button class="chip active" data-period="0">Tout</button>
      </div>
      <div class="chips">
        <button class="chip toggle" id="unreadOnly">Non lus</button>
        <button class="chip toggle" id="starredOnly">★ Favoris</button>
        <button class="chip ghost" id="markAllRead">Tout marquer comme lu</button>
      </div>
      <label class="auto">
        Auto
        <select id="autoRefresh">
          <option value="0">désactivée</option>
          <option value="5">5 min</option>
          <option value="15" selected>15 min</option>
          <option value="30">30 min</option>
        </select>
      </label>
    </section>

    <div class="notice" id="notice" hidden></div>

    <section class="feed" id="feed" aria-live="polite"></section>
    <div class="empty" id="empty" hidden>
      <div class="empty-icon">🛰️</div>
      <p>Aucun article ne correspond à vos filtres.</p>
    </div>
  </main>

  <footer class="footer">
    Sources : <a href="https://cert.cyber.gouv.fr/" target="_blank" rel="noopener">CERT-FR (ANSSI)</a> ·
    <a href="https://www.it-connect.fr/" target="_blank" rel="noopener">IT-Connect</a> —
    Raccourcis : <kbd>/</kbd> rechercher · <kbd>R</kbd> actualiser · <kbd>1</kbd>–<kbd>5</kbd> catégories
  </footer>

  <div class="toasts" id="toasts" aria-live="assertive"></div>

  <template id="cardTpl">
    <article class="card">
      <div class="card-bar"></div>
      <div class="card-body">
        <div class="card-meta">
          <span class="badge cat"></span>
          <span class="badge new">Nouveau</span>
          <time class="date"></time>
        </div>
        <h3 class="card-title"><a target="_blank" rel="noopener"></a></h3>
        <p class="card-summary"></p>
        <div class="cves"></div>
        <div class="card-actions">
          <button class="mini star" title="Ajouter aux favoris">☆</button>
          <button class="mini read" title="Marquer comme lu / non lu">Marquer lu</button>
          <button class="mini more" title="Afficher plus">Détails</button>
          <a class="mini open" target="_blank" rel="noopener">Ouvrir ↗</a>
        </div>
      </div>
    </article>
  </template>

  <script src="assets/app.js" defer></script>
</body>
</html>
