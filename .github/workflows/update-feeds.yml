name: Mise à jour des flux RSS

on:
  schedule:
    - cron: "*/30 * * * *"   # toutes les 30 minutes
  workflow_dispatch:
  push:
    paths: ["config/feeds.json", "scripts/**"]

permissions:
  contents: write

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Récupération des flux
        run: node scripts/fetch-feeds.mjs
      - name: Commit des nouvelles données
        run: |
          if git diff --quiet -- data/feeds.json; then echo "Aucun changement"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/feeds.json
          git commit -m "chore: mise à jour des flux RSS"
          git push
